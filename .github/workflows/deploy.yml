name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push cancel an in-flight deploy, but never interrupt a
# deploy that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (wasm target)
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-wasm-

      - name: Install trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: latest

      - name: Install wasm-bindgen-cli
        uses: jetli/wasm-bindgen-action@v0.2.0
        with:
          version: latest

      # --public-url ./ makes every asset reference relative, so the same
      # build works at /<repo>/ (project page), at a custom domain root, and
      # when opened from the local dist/ folder.
      - name: Build
        run: trunk build --release --public-url ./

      # Stops GitHub from running the output through Jekyll, which would
      # strip files/dirs beginning with an underscore.
      - name: Add .nojekyll
        run: touch dist/.nojekyll

      # enablement: true lets this action turn on Pages (build_type=workflow)
      # via the API using the `pages: write` permission above, so the repo
      # needs no manual Settings change. Without it the action only *reads*
      # the Pages config and fails with "Get Pages site failed" if unset.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
