[package]
name = "tauri-image-files"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "FilePropertyBag",
    "HtmlElement",
    "HtmlInputElement",
    "Navigator",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "Url",
] }

[workspace]
members = ["src-tauri"]
